# Render Blueprint for Stagehand (https://render.com/docs/blueprint-spec).
#
# Deploys the API (web service) and worker (background service) from their
# Dockerfiles. Postgres (Neon/Supabase), Redis (Upstash), and ClickHouse
# (ClickHouse Cloud) are external managed services — set their connection
# strings as env vars in the Render dashboard (sync: false = secret, not in git).
#
# Apply with: Render Dashboard -> New -> Blueprint -> point at this repo.
# Secrets are NEVER committed here; every secret uses `sync: false`.

services:
  # ---- API (FastAPI) ----
  - type: web
    name: stagehand-api
    runtime: docker
    plan: starter
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /health
    # Apply DB migrations before each deploy goes live (idempotent).
    preDeployCommand: "alembic upgrade head"
    envVars:
      - key: APP_ENV
        value: production
      - key: FRONTEND_URL
        sync: false # e.g. https://stagehand.vercel.app
      - key: BACKEND_CORS_ORIGINS
        sync: false # comma-separated extra origins, if any
      - key: DATABASE_URL
        sync: false # Neon/Supabase connection string
      - key: REDIS_URL
        sync: false # Upstash rediss:// URL
      - key: CLICKHOUSE_HOST
        sync: false
      - key: CLICKHOUSE_PORT
        value: "8443"
      - key: CLICKHOUSE_USER
        sync: false
      - key: CLICKHOUSE_PASSWORD
        sync: false
      - key: CLICKHOUSE_DATABASE
        value: stagehand
      - key: CLICKHOUSE_SECURE
        value: "true"
      - key: BILLING_MODE
        value: mock
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CHEAP_MODEL_NAME
        sync: false
      - key: STRONG_MODEL_NAME
        sync: false
      - key: DEFAULT_EVAL_MODEL_NAME
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false

  # ---- Worker (engine + run consumer) ----
  - type: worker
    name: stagehand-worker
    runtime: docker
    plan: starter
    dockerfilePath: ./apps/worker/Dockerfile
    dockerContext: ./apps/worker
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CLICKHOUSE_HOST
        sync: false
      - key: CLICKHOUSE_PORT
        value: "8443"
      - key: CLICKHOUSE_USER
        sync: false
      - key: CLICKHOUSE_PASSWORD
        sync: false
      - key: CLICKHOUSE_DATABASE
        value: stagehand
      - key: CLICKHOUSE_SECURE
        value: "true"
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CHEAP_MODEL_NAME
        sync: false
      - key: STRONG_MODEL_NAME
        sync: false
      - key: DEFAULT_EVAL_MODEL_NAME
        sync: false
      - key: UCB_EXPLORATION_WEIGHT
        value: "1.0"
      - key: BILLING_MODE
        value: mock
