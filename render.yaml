# Render Blueprint — Stagehand FREE HOSTED DEMO (https://render.com/docs/blueprint-spec).
#
# This blueprint deploys the NO-COST demo:
#   - Deploys ONLY the API web service (Docker), on Render's free plan.
#   - The frontend is deployed separately on Vercel (see apps/web/vercel.json).
#   - Database is Neon Postgres          -> DATABASE_URL
#   - Redis is Upstash                   -> REDIS_URL (live WebSocket trace fanout)
#   - ClickHouse is DISABLED in hosted_demo mode (traces stored in Postgres).
#   - The separate worker is DISABLED; the API runs short mock demo runs itself
#     via a background task (HOSTED_DEMO_EXECUTION=true).
#   - AI and billing are mock only — no real provider or Stripe keys.
#
# The full local architecture still supports the worker + ClickHouse via
# docker-compose (DEPLOYMENT_MODE=local); this file is intentionally the free
# demo only. Apply with: Render Dashboard -> New -> Blueprint -> this repo.
# Secrets are NEVER committed here; every secret uses `sync: false`.

services:
  # ---- API (FastAPI) — the only service in hosted demo mode ----
  - type: web
    name: stagehand-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /health
    # Apply DB migrations before each deploy goes live (idempotent).
    preDeployCommand: "alembic upgrade head"
    envVars:
      - key: APP_ENV
        value: production
      # Hosted demo mode: no ClickHouse, no worker, Postgres trace fallback.
      - key: DEPLOYMENT_MODE
        value: hosted_demo
      - key: CLICKHOUSE_ENABLED
        value: "false"
      - key: WORKER_ENABLED
        value: "false"
      - key: HOSTED_DEMO_EXECUTION
        value: "true"
      - key: TRACE_STORAGE
        value: postgres
      # Mock AI + mock billing — no real keys or charges.
      - key: AI_PROVIDER
        value: mock
      - key: BILLING_MODE
        value: mock
      - key: CHEAP_MODEL_NAME
        value: mock-cheap
      - key: STRONG_MODEL_NAME
        value: mock-strong
      - key: DEFAULT_EVAL_MODEL_NAME
        value: mock-cheap
      # Auth: JWT_SECRET_KEY is REQUIRED in production. Generate a strong random
      # value and set it in the dashboard (never commit it).
      - key: JWT_SECRET_KEY
        sync: false # e.g. `openssl rand -hex 32`
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRES_MINUTES
        value: "1440"
      # Set these in the Render dashboard (not committed).
      - key: FRONTEND_URL
        sync: false # e.g. https://stagehand.vercel.app
      - key: BACKEND_CORS_ORIGINS
        sync: false # comma-separated extra origins, if any
      - key: DATABASE_URL
        sync: false # Neon connection string
      - key: REDIS_URL
        sync: false # Upstash rediss:// URL
